[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "LookPyrenees"
version = "0.0.1"
description = "Downloading and visualize snow condition in pyrenees"
readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [{ name = "Romain Buguet de Chargère", email = "rbuguet@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "eodag",
    "folium",
    "geopandas",
    "google-cloud-storage",
    "matplotlib",
    "numpy",
    "pillow",
    "rasterio",
    "rioxarray",
    "shapely",
]

[project.scripts]
LookPyrenees = "LookPyrenees.cli:run"

[dependency-groups]
dev = [
    "pre-commit",
    "ruff",
    "pytest",
    "httpx",
]
scene-api = [
    "fastapi",
    "uvicorn[standard]",
    "pystac-client",
    "rasterio",
    "numpy",
    "pillow",
    "google-cloud-storage",
    "pyproj",
    "requests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/LookPyrenees", "src/scene_api"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "C90", "PL"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.pytest.ini_options]
markers = ["network: tests needing network access (disabled by default, run with --run-network)"]
addopts = "-m 'not network'"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
"src/scene_api/**" = ["PLC0415", "PLR2004", "PLR0913", "PLR0917"]
