[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "LookPyrenees"
version = "0.0.1"
description = "Downloading and visualize snow condition in pyrenees"
readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [{ name = "Romain Buguet de Chargère", email = "rbuguet@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "eodag",
    "folium",
    "geopandas",
    "google-cloud-storage",
    "matplotlib",
    "numpy",
    "pillow",
    "rasterio",
    "rioxarray",
    "shapely",
]

[project.scripts]
LookPyrenees = "LookPyrenees.cli:run"

[dependency-groups]
dev = ["isort", "flake8", "mypy", "pre-commit", "pylint"]

[tool.hatch.build.targets.wheel]
packages = ["src/LookPyrenees"]
