name: deploy-site

on:
  push:
    branches:
    - main
    paths:
    - 'site/**'
    - 'firebase.json'
    - '.firebaserc'
    - '.github/workflows/deploy-site.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Deploy to Firebase Hosting
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: ${{ secrets.GITHUB_TOKEN }}
        firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOOKPYRENEES_6E7E4 }}
        projectId: lookpyrenees-6e7e4
        channelId: live
